services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payslip
      POSTGRES_PASSWORD: payslip
      POSTGRES_DB: payslip
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payslip"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://payslip:payslip@db:5432/payslip?schema=public
      JWT_SECRET: change-this-to-a-long-random-secret
      JWT_EXPIRES_IN: 8h
      PORT: 4000
      CORS_ORIGIN: http://localhost:8080
      PUBLIC_BASE_URL: http://localhost:8080
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMe123!
      COMPANY_NAME: Your Company Pvt Ltd
      COMPANY_ADDRESS: 123 Business Street, City, Country
    volumes:
      - backend-storage:/app/storage
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db-data:
  backend-storage:
